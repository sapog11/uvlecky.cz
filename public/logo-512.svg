<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C2B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24365A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#grad1)" stroke="#3E6BA0" stroke-width="4"/>

  <!-- Medical cross (white) - larger -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="216" y="120" width="80" height="272" rx="10"/>
    <!-- Horizontal bar -->
    <rect x="120" y="216" width="272" height="80" rx="10"/>
  </g>

  <!-- Accent circle -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#6F9A85" stroke-width="3" opacity="0.8"/>

  <!-- Optional glow effect -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#3E6BA0" stroke-width="1" opacity="0.3"/>
</svg>
