<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1C2B4A" stroke="#3E6BA0" stroke-width="2"/>

  <!-- Medical cross (white) -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="85" y="50" width="30" height="100" rx="4"/>
    <!-- Horizontal bar -->
    <rect x="50" y="85" width="100" height="30" rx="4"/>
  </g>

  <!-- Accent circle (blue) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#6F9A85" stroke-width="2" opacity="0.6"/>

  <!-- Optional: Add clinic name for branding -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">
    U VLEČKY
  </text>
</svg>
