<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Transparent background - white cross only -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="85" y="50" width="30" height="100" rx="4"/>
    <!-- Horizontal bar -->
    <rect x="50" y="85" width="100" height="30" rx="4"/>
  </g>

  <!-- Optional: outer circle outline for context -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
